name: Build plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
        working-directory: SpiritSakura
      - uses: actions/upload-artifact@v4
        with:
          name: SpiritSakura-jar
          path: SpiritSakura/build/libs/SpiritSakura-*.jar
